[package]
name = "carbon-treemap-disk"
version = "0.1.0"
description = "Carbon Disk Treemap – macOS disk usage visualiser"
authors = []
edition = "2024"

[lib]
name = "carbon_treemap_disk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
tauri-plugin-dialog = "2"
blake3 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
trash = "5.2.9"
